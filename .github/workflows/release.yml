name: 🚀 Multi-Platform Cloud Build & Release (多端云端自动打包与发布)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v2.2.1)'
        required: true
        default: 'v2.2.1'

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Build Windows Binaries (Tauri 2.0 Native) & Run Tests
  # -------------------------------------------------------------
  build-windows:
    name: 🪟 Build Windows Packages (Tauri 2.0 Native)
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🦀 Setup Rust Toolchain for Tauri
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: 🧪 Run Physical Tests Suite
        run: npm test

      - name: 🛠️ Extract Version Number
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.tag_name }}"
          else
            RAW_TAG="${{ github.ref_name }}"
          fi
          VERSION="${RAW_TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$RAW_TAG" >> $GITHUB_ENV
          echo "Version is $VERSION, Tag is $RAW_TAG"

      - name: ⚙️ Sync Version Across Projects
        run: node scripts/bump-version.js ${{ env.VERSION }}

      - name: 🦀 Build Tauri Application (x64)
        run: npx @tauri-apps/cli build

      - name: 📁 Prepare Windows Release Artifacts
        run: node scripts/prepare-windows-artifacts.js ${{ env.VERSION }}

      - name: 📤 Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist_output/*
          if-no-files-found: error

  # -------------------------------------------------------------
  # Job 2: Build Android Native APK
  # -------------------------------------------------------------
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: 🛠️ Extract Version Number
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.tag_name }}"
          else
            RAW_TAG="${{ github.ref_name }}"
          fi
          VERSION="${RAW_TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$RAW_TAG" >> $GITHUB_ENV
          echo "Version is $VERSION, Tag is $RAW_TAG"

      - name: ⚙️ Sync Version Across Projects
        run: node scripts/bump-version.js ${{ env.VERSION }}

      - name: 📦 Build Mobile Web Bundle
        run: node scripts/build-mobile-web.js

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🩹 Patch Android Java 17 Compatibility
        run: node scripts/patch-android-java17.js

      - name: 🔨 Compile Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📁 Prepare Android Release Artifact
        run: |
          mkdir -p dist_output
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist_output/LanDisk-Pro-${{ env.VERSION }}.apk"
          ls -la dist_output/

      - name: 📤 Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: dist_output/*
          if-no-files-found: error

  # -------------------------------------------------------------
  # Job 3: Publish GitHub Release with All Native Artifacts
  # -------------------------------------------------------------
  publish-release:
    name: 🚀 Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Extract Version & Tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.tag_name }}"
          else
            RAW_TAG="${{ github.ref_name }}"
          fi
          VERSION="${RAW_TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$RAW_TAG" >> $GITHUB_ENV

      - name: 📥 Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: release_assets

      - name: 📥 Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-binaries
          path: release_assets

      - name: 🔍 Inspect Collected Release Assets
        run: |
          echo "=== Collected Release Assets for ${{ env.TAG_NAME }} ==="
          ls -lh release_assets/

      - name: 🚀 Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "猫步互联 Pro ${{ env.TAG_NAME }} - 纯原生中文安装与 MSI 支持"
          draft: false
          prerelease: false
          files: |
            release_assets/LanDisk-Pro-${{ env.VERSION }}-Setup.exe
            release_assets/LanDisk-Pro-${{ env.VERSION }}-Setup.msi
            release_assets/LanDisk-Pro-${{ env.VERSION }}-Portable.exe
            release_assets/LanDisk-Pro-${{ env.VERSION }}.apk
          body: |
            ### 🚀 猫步互联 Pro ${{ env.TAG_NAME }} 全新纯原生中文安装与 MSI 支持说明

            本版本已彻底移除历史 Electron 依赖，全面升级为 **Tauri 2.0 (Rust) + Node.js SEA 独立单二进制架构**，安装包体积大幅瘦身 **87%** 至约 **25MB**！

            #### ✨ 核心特性与亮点：
            1. 🇨🇳 **原生简体中文安装界面**：Windows NSIS 安装程序已全面配置为标准简体中文；
            2. 🪟 **多格式安装包支持**：同时提供 Windows NSIS 安装包 (`.exe`)、企业级 WiX 安装包 (`.msi`) 及免安装便携版 (`.exe`)；
            3. 🦀 **全新 Tauri 2.0 纯原生宿主**：无边框玻璃拟态毛玻璃窗口、系统级原生托盘控制、开机自启动与原生极轻渲染；
            4. ⚡ **Node.js SEA 独立单二进制服务端**：零环境依赖运行，无需额外安装 Node 环境，秒开启动；
            5. 📱 **全平台跨端矩阵**：Android 原生 APK (约 6.8MB)、Windows 便携免安装版 (约 9.2MB)、Windows NSIS 极速安装程序 (约 25MB) 与 MSI 安装包；
            6. 📺 **DLNA 无线大屏投屏**：局域网视频与多媒体一键投屏至电视盒子；
            7. 📚 **智能学习计划与专注打卡**：课时智能扫描、进度跟踪与实操考核；
            8. 🎛️ **跨端遥控与屏幕镜像**：系统音量控制、电源管理（睡眠/锁屏/定时关机）与屏幕低延迟流式镜像。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
