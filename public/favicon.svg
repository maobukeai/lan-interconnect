<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f7fa"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007aff"/>
      <stop offset="100%" stop-color="#0056b3"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- iOS Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="104" ry="104" fill="url(#bgGrad)" stroke="rgba(0, 0, 0, 0.06)" stroke-width="4" filter="url(#subtleShadow)"/>

  <!-- LAN Signal Waves (Top Center) -->
  <g fill="none" stroke="url(#iconGrad)" stroke-width="16" stroke-linecap="round">
    <!-- Inner Wave -->
    <path d="M 216 140 A 60 60 0 0 1 296 140"/>
    <!-- Middle Wave -->
    <path d="M 186 110 A 100 100 0 0 1 326 110"/>
    <!-- Outer Wave -->
    <path d="M 156 80 A 140 140 0 0 1 356 80"/>
  </g>

  <!-- Cat Paw Print (Center Bottom) -->
  <g fill="url(#iconGrad)">
    <!-- Main Large Pad -->
    <path d="M 256 280 C 210 280 180 320 180 360 C 180 400 215 420 256 420 C 297 420 332 400 332 360 C 332 320 302 280 256 280 Z"/>
    <!-- Toe 1 (Far Left) -->
    <ellipse cx="170" cy="265" rx="22" ry="30" transform="rotate(-25 170 265)"/>
    <!-- Toe 2 (Mid Left) -->
    <ellipse cx="218" cy="225" rx="22" ry="32" transform="rotate(-10 218 225)"/>
    <!-- Toe 3 (Mid Right) -->
    <ellipse cx="294" cy="225" rx="22" ry="32" transform="rotate(10 294 225)"/>
    <!-- Toe 4 (Far Right) -->
    <ellipse cx="342" cy="265" rx="22" ry="30" transform="rotate(25 342 265)"/>
  </g>
</svg>
